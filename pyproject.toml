[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-intelligence"
version = "0.1.0"
description = "A maintainable Formula 1 analytics pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.3",
    "kagglehub>=0.3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "plotly>=5.18",
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
    "streamlit>=1.49",
    "xlrd>=2.0",
]

[project.scripts]
f1-ingest = "f1_intelligence.data.cli:main"
f1-transform = "f1_intelligence.data.transform_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
